project:
  type: book
  output-dir: docs
  resources:
    - .nojekyll   # disable GitHub Pages Jekyll processing of the rendered site

book:
  title: "Supplementary material: Human disturbance and the magnitude of phenotypic divergence"
  author: "TBA"
  date: today
  repo-url: https://github.com/Santiago-0rtega/Magnitude_pace_modern_life
  downloads: [pdf]
  search: true
  sidebar:
    style: floating
    collapse-level: 2
  chapters:
    - index.qmd
    - part: "Data & Effect Sizes"
      chapters:
        - chapters/01_data_preparation.qmd
        - chapters/02_lnm_effect_sizes.qmd
        - chapters/03_descriptive_summaries.qmd
    - part: "Non-independence"
      chapters:
        - chapters/04_dependency_structure.qmd
        - chapters/04b_phylogeny.qmd
    - part: "Location–Scale Models"
      chapters:
        - chapters/05_location_scale_model_grid.qmd
    - part: "Results — one chapter per model"
      chapters:
        - chapters/models/m00.qmd
        - chapters/models/m01.qmd
        - chapters/models/m02.qmd
        - chapters/models/m03.qmd
        - chapters/models/m04.qmd
        - chapters/models/m05.qmd
        - chapters/models/m07.qmd
        - chapters/models/m08.qmd
        - chapters/models/m11.qmd
    - part: "Figures & Reproducibility"
      chapters:
        - chapters/07_sensitivity_analyses.qmd
        - chapters/08_publication_figures.qmd
        - chapters/09_reproducibility.qmd
  appendices:
    - chapters/appendix/sensitivity_min_n.qmd
    - chapters/appendix/sensitivity_no_phylogeny.qmd
    - chapters/appendix/sensitivity_sys_id.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    number-sections: true
    df-print: paged
    fig-width: 9
    fig-height: 6
    fig-dpi: 150
    link-external-icon: true
    smooth-scroll: true

crossref:
  fig-prefix: "Fig."
  tbl-prefix: "Table"
  eq-prefix: "Eq."

execute:
  warning: false
  message: false
  freeze: auto
  cache: false
