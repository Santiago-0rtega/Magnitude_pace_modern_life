project:
  type: book
  output-dir: docs
  pre-render: Rscript chapters/Rscripts/21_validate_summary_artifacts.R
  resources:
    - .nojekyll   # disable GitHub Pages Jekyll processing of the rendered site

book:
  title: "Environmental change leaves no universal signature of phenotypic divergence"
  subtitle: "Supplementary material: a step-by-step reproducible analysis"
  author:
    - name: "Santiago Ortega"
      orcid: "0000-0002-3518-276X"
      email: ortegara@ualberta.ca
    - name: "Eduardo S.A. Santos"
      orcid: "0000-0002-0434-3655"
    - name: "Kiyoko Gotanda"
      orcid: "0000-0002-3666-0700"
    - name: "Sarah Sanderson"
      orcid: "0000-0003-1525-2326"
    - name: "Lucas Damian Gorné"
      orcid: "0000-0003-1940-1755"
    - name: "Andrew Hendry"
      orcid: "0000-0002-4807-6667"
    - name: "Shinichi Nakagawa"
      orcid: "0000-0002-7765-5182"
  date: today
  repo-url: https://github.com/Santiago-0rtega/Magnitude_pace_modern_life
  downloads: [pdf]
  search: true
  sidebar:
    style: floating
    collapse-level: 2
    search: true
  chapters:
    - index.qmd
    - part: "Data & Effect Sizes"
      chapters:
        - chapters/01_data_preparation.qmd
        - chapters/02_lnm_effect_sizes.qmd
        - chapters/03_descriptive_summaries.qmd
        - chapters/03b_moderator_associations.qmd
    - part: "Non-independence"
      chapters:
        - chapters/04_dependency_structure.qmd
        - chapters/04b_phylogeny.qmd
    - part: "Location–Scale Models"
      chapters:
        - chapters/05_location_scale_model_grid.qmd
    - part: "Results — one chapter per model"
      chapters:
        - chapters/models/m00.qmd
        - chapters/models/m01.qmd
        - chapters/models/m02.qmd
        - chapters/models/m03.qmd
        - chapters/models/m04.qmd
        - chapters/models/m05.qmd
        - chapters/models/m07.qmd
    - part: "Figures & Reproducibility"
      chapters:
        - chapters/07b_small_study_effects.qmd
        - chapters/07_sensitivity_analyses.qmd
        - chapters/08_publication_figures.qmd
        - chapters/09_reproducibility.qmd
  appendices:
    - chapters/models/m08.qmd
    - chapters/appendix/sensitivity_min_n.qmd
    - chapters/appendix/sensitivity_no_phylogeny.qmd
    - chapters/appendix/sensitivity_sys_id.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    number-sections: true
    df-print: paged
    fig-width: 9
    fig-height: 6
    fig-dpi: 150
    link-external-icon: true
    smooth-scroll: true
    css: styles.css
    code-copy: true
    anchor-sections: true
    grid:
      sidebar-width: 290px
      body-width: 900px
      margin-width: 260px
      gutter-width: 1.5rem

crossref:
  fig-prefix: "Fig."
  tbl-prefix: "Table"
  eq-prefix: "Eq."

execute:
  warning: false
  message: false
  # Numerical chapters depend on synced RDS/CSV outputs whose timestamps are
  # not tracked by Quarto's source-only freeze logic. Always execute so rerun
  # summaries cannot silently remain stale.
  freeze: false
  cache: false
